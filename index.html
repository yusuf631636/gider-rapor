<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öz Urfa Kebap | Yönetim Paneli</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f172a;
            padding: 20px;
            color: #f1f5f9;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: #1e293b; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .header h1 { color: #f97316; font-size: 24px; }
        .api-bar { background: #1e293b; border-radius: 20px; padding: 15px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .api-bar input { padding: 8px 15px; border-radius: 30px; border: 1px solid #334155; background: #0f172a; color: white; width: 300px; }
        .btn { background: #f97316; color: white; border: none; padding: 8px 20px; border-radius: 30px; cursor: pointer; }
        .btn-outline { background: transparent; border: 1px solid #f97316; color: #f97316; }
        .stats-grid { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #1e293b; border-radius: 20px; padding: 20px; flex: 1; min-width: 150px; text-align: center; }
        .stat-card h4 { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
        .stat-number { font-size: 24px; font-weight: bold; }
        .nakit { color: #10b981; }
        .kredi { color: #3b82f6; }
        .ciro { color: #fbbf24; }
        .gider { color: #f97316; }
        .kar { color: #10b981; }
        .loss { color: #ef4444; }
        .card { background: #1e293b; border-radius: 20px; margin-bottom: 20px; }
        .card-header { padding: 15px 20px; border-bottom: 1px solid #334155; font-weight: bold; color: #f97316; }
        .card-body { padding: 15px 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; }
        .amount-right { text-align: right; }
        .badge { background: #f97316; color: white; padding: 4px 12px; border-radius: 30px; font-size: 11px; }
        .footer { text-align: center; font-size: 11px; color: #64748b; margin-top: 20px; }
        @media (max-width: 700px) { .stat-number { font-size: 18px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🧾 ÖZ URFA KEBAP - Yönetim Paneli</h1>
        <p>SambaPOS SQL Bağlantılı | Gerçek Zamanlı</p>
        <div id="dateTime" style="font-size: 11px; color: #f97316; margin-top: 8px;"></div>
    </div>

    <div class="api-bar">
        <span>🌐 API Adresi:</span>
        <input type="text" id="apiUrl" value="http://100.97.45.8:3001">
        <button class="btn" onclick="apiUrlKaydet()">Kaydet</button>
        <button class="btn" onclick="tumVerileriGuncelle()">Güncelle</button>
    </div>

    <!-- Ana Kartlar -->
    <div class="stats-grid">
        <div class="stat-card"><h4>💰 Nakit Gelir</h4><div class="stat-number nakit" id="nakitGelir">0 ₺</div></div>
        <div class="stat-card"><h4>💳 Kredi Kartı</h4><div class="stat-number kredi" id="krediGelir">0 ₺</div></div>
        <div class="stat-card"><h4>📊 Toplam Ciro</h4><div class="stat-number ciro" id="toplamCiro">0 ₺</div></div>
        <div class="stat-card"><h4>📉 Toplam Gider</h4><div class="stat-number gider" id="toplamGider">0 ₺</div></div>
        <div class="stat-card"><h4>📈 Net Kâr</h4><div class="stat-number" id="netKar">0 ₺</div></div>
    </div>

    <!-- Gider Detayları -->
    <div class="card">
        <div class="card-header">📝 Giderler Detayı</div>
        <div class="card-body">
            <div id="giderDetay">Yükleniyor...</div>
        </div>
    </div>

    <!-- Modüller -->
    <div class="card">
        <div class="card-header">🧩 Modüller</div>
        <div class="card-body">
            <div id="moduller">Yükleniyor...</div>
        </div>
    </div>

    <div class="footer">
        ⚡ Öz Urfa Kebap | SambaPOS SQL Bağlantılı
    </div>
</div>

<script>
    let API_BASE = localStorage.getItem('apiBase') || 'http://100.97.45.8:3001';
    document.getElementById('apiUrl').value = API_BASE;
    
    setInterval(() => {
        document.getElementById('dateTime').innerHTML = `📅 ${new Date().toLocaleDateString('tr-TR')} - 🕐 ${new Date().toLocaleTimeString('tr-TR')}`;
    }, 1000);

    function apiUrlKaydet() {
        API_BASE = document.getElementById('apiUrl').value;
        localStorage.setItem('apiBase', API_BASE);
        alert('API adresi kaydedildi');
        tumVerileriGuncelle();
    }

    async function tumVerileriGuncelle() {
        let tarih = new Date().toISOString().slice(0,10);
        
        // Ana Panel
        try {
            let anaRes = await fetch(`${API_BASE}/api/anaPanel?tarih=${tarih}`, { headers: { 'ngrok-skip-browser-warning': 'true' } });
            let ana = await anaRes.json();
            document.getElementById('nakitGelir').innerHTML = (ana.NakitGelir || 0).toLocaleString('tr-TR') + ' ₺';
            document.getElementById('krediGelir').innerHTML = (ana.KrediGelir || 0).toLocaleString('tr-TR') + ' ₺';
            document.getElementById('toplamCiro').innerHTML = (ana.ToplamCiro || 0).toLocaleString('tr-TR') + ' ₺';
            document.getElementById('toplamGider').innerHTML = (ana.ToplamGider || 0).toLocaleString('tr-TR') + ' ₺';
            let netKar = (ana.ToplamCiro || 0) - (ana.ToplamGider || 0);
            document.getElementById('netKar').innerHTML = netKar.toLocaleString('tr-TR') + ' ₺';
            if (netKar >= 0) document.getElementById('netKar').className = 'stat-number nakit';
            else document.getElementById('netKar').className = 'stat-number loss';
        } catch(err) { console.error(err); }
        
        // Gider Detayları
        try {
            let giderRes = await fetch(`${API_BASE}/api/giderler?tarih=${tarih}`, { headers: { 'ngrok-skip-browser-warning': 'true' } });
            let data = await giderRes.json();
            
            if (data.giderler && data.giderler.length > 0) {
                let html = '<table><thead><tr><th>Gider Adı</th><th>Tutar</th><th>Tarih</th></tr></thead><tbody>';
                data.giderler.forEach(g => {
                    html += `<tr><td>${g.GiderAdi || '-'}</td><td class="amount-right">${(g.Tutar || 0).toLocaleString('tr-TR')} ₺</td><td>${g.Tarih || '-'}</td></tr>`;
                });
                html += `<tr style="background:#334155;"><td><strong>TOPLAM</strong></td><td class="amount-right"><strong>${(data.toplam || 0).toLocaleString('tr-TR')} ₺</strong></td><td></td></tr>`;
                html += '</tbody></table>';
                document.getElementById('giderDetay').innerHTML = html;
            } else {
                document.getElementById('giderDetay').innerHTML = '<div>Bugün için gider bulunamadı</div>';
            }
        } catch(err) {
            document.getElementById('giderDetay').innerHTML = '<div>Giderler alınamadı</div>';
        }
        
        // Modüller
        try {
            let modulRes = await fetch(`${API_BASE}/api/modulListesi`, { headers: { 'ngrok-skip-browser-warning': 'true' } });
            let data = await modulRes.json();
            
            if (data.moduller && data.moduller.length > 0) {
                let html = '<div style="display:flex; flex-wrap:wrap; gap:10px;">';
                data.moduller.forEach(m => {
                    html += `<button class="btn-outline" onclick="moduluAc('${m.path}')">🧩 ${m.adi}</button>`;
                });
                html += '</div>';
                document.getElementById('moduller').innerHTML = html;
            } else {
                document.getElementById('moduller').innerHTML = '<div>Henüz modül bulunamadı</div>';
            }
        } catch(err) {
            document.getElementById('moduller').innerHTML = '<div>Modüller alınamadı</div>';
        }
    }
    
    function moduluAc(path) {
        window.open(`${API_BASE}${path}`, '_blank');
    }

    tumVerileriGuncelle();
</script>
</body>
</html>
