<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öz Urfa Kebap | Anlık Rapor Sistemi</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f4f8; }
        .container { max-width: 1200px; margin: auto; background: white; border-radius: 20px; padding: 20px; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .card { flex: 1; background: #f8fafc; padding: 20px; border-radius: 16px; text-align: center; }
        .card h3 { margin: 0; font-size: 14px; color: #64748b; }
        .card .value { font-size: 32px; font-weight: bold; margin: 10px 0; }
        button { background: #f97316; border: none; padding: 10px 20px; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; margin: 5px; }
        input, select { padding: 8px; margin: 5px; border-radius: 16px; border: 1px solid #cbd5e1; }
        .filter-buttons { margin: 20px 0; }
        .filter-btn { background: #e2e8f0; color: #1e293b; }
        .filter-btn.active { background: #f97316; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    </style>
</head>
<body>
<div class="container">
    <h1>🧾 Öz Urfa Kebap - Anlık Rapor Sistemi</h1>
    <p>API Adresi: <input type="text" id="apiUrl" value="https://xxxx.ngrok.io" style="width: 300px;"> <button onclick="apiUrlDegistir()">Kaydet</button></p>
    
    <div class="stats" id="stats">
        <div class="card"><h3>📀 Günlük Ciro</h3><div class="value" id="gunlukCiro">0 ₺</div></div>
        <div class="card"><h3>💰 Nakit</h3><div class="value" id="gunlukNakit">0 ₺</div></div>
        <div class="card"><h3>💳 Kredi Kartı</h3><div class="value" id="gunlukKredi">0 ₺</div></div>
    </div>

    <div class="filter-buttons">
        <button class="filter-btn active" onclick="raporGetir('gunluk')">📅 Günlük Rapor</button>
        <button class="filter-btn" onclick="raporGetir('aylik')">📆 Mayıs 2026</button>
    </div>

    <div id="manuelAlan">
        <h3>➕ Manuel Gider Ekle</h3>
        <input type="date" id="manuelTarih">
        <input type="text" id="manuelAciklama" placeholder="Açıklama">
        <input type="number" id="manuelTutar" placeholder="Tutar">
        <select id="manuelTur"><option>Nakit</option><option>Kredi Kartı</option></select>
        <button onclick="manuelGiderEkle()">Ekle</button>
        <button onclick="manuelGiderleriGoster()">Manuel Giderleri Göster</button>
    </div>

    <div id="manuelListe"></div>
</div>

<script>
    let apiBase = localStorage.getItem('apiBase') || 'https://xxxx.ngrok.io';
    document.getElementById('apiUrl').value = apiBase;
    
    function apiUrlDegistir() {
        apiBase = document.getElementById('apiUrl').value;
        localStorage.setItem('apiBase', apiBase);
        alert('API adresi kaydedildi');
    }
    
    async function raporGetir(tip) {
        try {
            let url = tip === 'gunluk' ? `${apiBase}/api/gunluk` : `${apiBase}/api/aylik?ay=5&yil=2026`;
            let res = await fetch(url);
            let data = await res.json();
            document.getElementById('gunlukCiro').innerText = (data.ToplamCiro || 0).toLocaleString() + ' ₺';
            document.getElementById('gunlukNakit').innerText = (data.NakitToplam || 0).toLocaleString() + ' ₺';
            document.getElementById('gunlukKredi').innerText = (data.KrediToplam || 0).toLocaleString() + ' ₺';
        } catch(e) { alert('API bağlantı hatası: ' + e.message); }
    }
    
    function manuelGiderEkle() {
        let giderler = JSON.parse(localStorage.getItem('manuelGiderler') || '[]');
        giderler.push({
            tarih: document.getElementById('manuelTarih').value,
            aciklama: document.getElementById('manuelAciklama').value,
            tutar: parseFloat(document.getElementById('manuelTutar').value),
            tur: document.getElementById('manuelTur').value
        });
        localStorage.setItem('manuelGiderler', JSON.stringify(giderler));
        alert('Eklendi');
        manuelGiderleriGoster();
    }
    
    function manuelGiderleriGoster() {
        let giderler = JSON.parse(localStorage.getItem('manuelGiderler') || '[]');
        let html = '<h3>📋 Manuel Giderler</h3><table><tr><th>Tarih</th><th>Açıklama</th><th>Tutar</th><th>Tür</th></tr>';
        giderler.forEach(g => {
            html += `<tr><td>${g.tarih}</td><td>${g.aciklama}</td><td>${g.tutar} ₺</td><td>${g.tur}</td></tr>`;
        });
        html += '</table>';
        document.getElementById('manuelListe').innerHTML = html;
    }
    
    raporGetir('gunluk');
    manuelGiderleriGoster();
</script>
</body>
</html>
